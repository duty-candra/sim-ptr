let raf;const loop=t=>{$$('canvas[data-c]').forEach((c,i)=>{const x=c.getContext('2d'),w=c.width,h=c.height,g=x.createLinearGradient(0,0,0,h*.6);g.addColorStop(0,'#5b8bb5');g.addColorStop(1,'#cfe3ee');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#4a6b3a';x.fillRect(0,h*.6,w,h*.4);x.fillStyle='rgba(255,255,255,.75)';for(let k=0;k<3;k++){const cx=((t/40+i*77+k*130)%(w+80))-40;x.beginPath();x.ellipse(cx,34+k*22,40,12,0,0,7);x.fill()}
x.fillStyle='#9aa0a6';x.fillRect(w/2-11,h*.45,22,h*.4);x.fillStyle='#333';x.fillRect(w/2-17,h*.43,34,9);x.fillStyle='#ff9446';x.fillRect(w/2-7,h*.55,14,9);for(let k=0;k<70;k++){x.fillStyle=`rgba(0,0,0,${Math.random()*.12})`;x.fillRect(Math.random()*w,Math.random()*h,2,1)}x.fillStyle='#fff';x.font='11px monospace';x.fillText('SIMULASI',w-72,h-10)});raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);S.cleanup=()=>cancelAnimationFrame(raf);

const dist=(a,b,c,d)=>{const R=6371000,t=x=>x*RAD,dl=t(c-a),dn=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const nearest=(la,lo)=>{let b=null;S.data.forEach(p=>{const d=dist(la,lo,p.lat,p.lon);if(!b||d<b.d)b={p,d}});return b};
const u8=d=>{const b=atob(d.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
function parseTiff(v,b){const le=v.getUint16(b)===0x4949,u16=o=>v.getUint16(o,le),u32=o=>v.getUint32(o,le);
const ifd=off=>{const n=u16(b+off),r={};for(let i=0;i<n;i++){const e=b+off+2+i*12,t=u16(e),ty=u16(e+2),c=u32(e+4),sz=([0,1,1,2,4,8][ty]||1)*c;r[t]={c,o:sz<=4?e+8:b+u32(e+8)}}return r};
const asc=x=>{let s='';for(let i=0;i<x.c-1;i++)s+=String.fromCharCode(v.getUint8(x.o+i));return s};
const rat=x=>{const a=[];for(let i=0;i<x.c;i++)a.push(u32(x.o+i*8)/u32(x.o+i*8+4));return a};
const i0=ifd(u32(b+4)),out={};
if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].o));if(ex[0x9003])out.date=asc(ex[0x9003])}
if(i0[0x8825]){const g=ifd(u32(i0[0x8825].o));if(g[2]&&g[4]){const d=rat(g[2]),e=rat(g[4]);let la=d[0]+d[1]/60+d[2]/3600,lo=e[0]+e[1]/60+e[2]/3600;if(g[1]&&asc(g[1])==='S')la=-la;if(g[3]&&asc(g[3])==='W')lo=-lo;out.lat=la;out.lon=lo}}
return out}
function exif(buf){try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return{};let o=2;while(o<v.byteLength-4){const m=v.getUint16(o),L=v.getUint16(o+2);if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return parseTiff(v,o+10);if((m&0xFF00)!==0xFF00)break;o+=2+L}}catch{}return{}}

const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
files.forEach(f=>{const nm=enc.encode(f.name),crc=crc32(f.data),h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.data.length,true);h.setUint16(26,nm.length,true);
parts.push(new Uint8Array(h.buffer),nm,f.data);
const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,f.data.length,true);c.setUint32(24,f.data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+f.data.length});

function ghf(path,o={}){const c=GH.cfg;return fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/${path}`,{...o,headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(o.headers||{})}})}

if([401,403,404].includes(r.status)){GH.canWrite=false;ghStatus('ro');toast('Token tidak punya izin tulis ke repo data — perubahan TIDAK tersimpan di GitHub.','err');return}break}

const nw=status(p);if(nw!==old){logEv(`${p.kode} → ${nw.toUpperCase()}`,nw);if(nw!=='online')toast(`${p.kode} → ${nw.toUpperCase()}`,nw==='offline'?'err':'warn')}});
hdr();S.onTick&&S.onTick()}catch(e){}}
async function ghPhoto(p){const data=p.foto,path=`photos/${p.id}.jpg`;try{S.photo[p.id]=data;const sha=await ghMeta(path,GH.cfg.branch),r=await ghPut(path,GH.cfg.branch,data.split(',')[1],sha,'SIM-PTR: foto '+p.kode,true);if(!r.ok)throw 0;p.foto='gh:'+path}catch{p.foto='';toast('Gagal mengunggah foto ke GitHub','err')}saveData()}
async function loadPhoto(p){if(!p||!String(p.foto).startsWith('gh:')||S.photo[p.id]||!GH.cfg)return;try{const r=await ghf(`contents/${p.foto.slice(3)}?ref=${encodeURIComponent(GH.cfg.branch)}`,{headers:{Accept:'application/vnd.github.raw+json'}});if(!r.ok)return;const b=await r.blob();S.photo[p.id]=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)});if(S.panel&&S.panel.id===p.id)renderPanel()}catch{}}
function ghDisconnect(){if(!confirm('Putuskan GitHub dan hapus cache data di perangkat ini?'))return;Object.values(K).forEach(k=>localStorage.removeItem(k));['simptr_gh','simptr_mode'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});sessionStorage.removeItem('simptr_sess');location.reload()}
function connectView(msg){$('#root').innerHTML=authCard(`<div class="org"><b>BNPP</b><small>Badan Nasional Pengelola Perbatasan RI</small></div><div class="ey">DATABASE GITHUB</div><h2>Hubungkan ke GitHub</h2><p class="mu">Seluruh data (PTR, pengguna, telemetri, foto) disimpan di repository GitHub privat milik Anda.</p>
<form id="cf"><label>Pemilik repo (username / organisasi)<input name="o" required value="duty-candra"></label><label>Nama repo data<input name="r" required placeholder="sim-ptr-data"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label>Branch data<input name="b" value="main"></label><label>Branch telemetri<input name="t" value="telemetry"></label></div><label>Fine-grained token<input name="k" type="password" required placeholder="github_pat_…"></label>
<label style="flex-direction:row;gap:8px;align-items:center"><input name="m" type="checkbox" style="width:auto"> Ingat token di perangkat ini</label><div class="err" id="ce">${esc(msg||'')}</div><button class="lg-btn">Sambungkan →</button><button type="button" class="lg-demo" id="lm">Mode lokal (demo, tanpa GitHub)</button></form>`,'Data Anda, di repository Anda sendiri',HERO_P);
$('#lm').onclick=()=>{LS.set('simptr_mode','local',true);location.reload()};
$('#cf').onsubmit=async ev=>{ev.preventDefault();const f=ev.target,c={owner:f.o.value.trim(),repo:f.r.value.trim(),branch:f.b.value.trim()||'main',tbranch:f.t.value.trim()||'telemetry',token:f.k.value.trim()};$('#ce').textContent='Menghubungkan…';
try{GH.cfg=c;const r=await ghf('');if(r.status===401)throw new Error('Token tidak valid');if(r.status===404)throw new Error('Repo tidak ditemukan, atau token tidak punya akses ke repo itu');if(!r.ok)throw new Error('GitHub '+r.status);
if(!(await r.json()).private&&!confirm('Repo ini PUBLIK: seluruh data & hash password dapat dibaca siapa saja. Tetap lanjutkan?'))throw new Error('Dibatalkan');
c.rw=await probeWrite();(f.m.checked?localStorage:sessionStorage).setItem('simptr_gh',JSON.stringify(c));location.reload()}catch(e){GH.cfg=null;$('#ce').textContent=e instanceof TypeError?'Tidak dapat menghubungi api.github.com. Penyebab umum: jaringan/DNS memblokir GitHub, ekstensi pemblokir iklan aktif, atau halaman dibuka di lingkungan yang membatasi koneksi (buka dari alamat github.io). Coba buka https://api.github.com di tab baru untuk mengujinya.':e.message}}}

/* ============ Init ============ */
(async function(){
if(GH.cfg){try{await pullAll()}catch(e){const m=e.message;GH.cfg=null;localStorage.removeItem('simptr_gh');sessionStorage.removeItem('simptr_gh');return connectView('Gagal membaca GitHub: '+m)}}
else if(LS.get('simptr_mode',null)!=='local'){return connectView()}
loadState();if(GH.cfg&&LS.get(K.set,null)===null){S.set.sim=false;LS.set(K.set,S.set)}
if(!LS.get(K.peng,null)){LS.set(K.peng,seedPeng())}if(!LS.get(K.data,null)){LS.set(K.data,seedData())}if(!LS.get(K.users,null)){LS.set(K.users,await seedUsers())}if(!LS.get(K.insp,null)){LS.set(K.insp,[])}if(!LS.get(K.wms,null)){LS.set(K.wms,[])}
loadState();initTel();startSim();
if(GH.cfg){pullTel();setInterval(pullTel,20000);setInterval(refreshDB,60000)}
S.user=S.users.find(u=>u.id===sessionStorage.getItem('simptr_sess')&&u.aktif)||null;S.user?shell():loginView()})();
</script>
